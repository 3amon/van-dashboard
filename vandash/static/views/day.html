<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van Power · Day</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/core.css">
<style>
  #clock { font-size: clamp(22px, 2.6vw, 34px); color: var(--ink); }
  .daylight { font-size: clamp(11px, 1vw, 14px); color: var(--muted); margin-left: auto; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .tile .value { font-size: clamp(22px, 2.6vw, 38px); }
</style>
</head>
<body>
  <header>
    <h1>Van Power</h1>
    <span id="status">connecting…</span>
    <span class="daylight" id="daylight">&nbsp;</span>
    <span id="clock"></span>
  </header>

  <div class="chart-card">
    <div class="chart-head">
      <div>
        <div class="label">Today's sun</div>
        <div class="hero" id="hero">—</div>
      </div>
      <div class="label" style="margin-left:auto">midnight → midnight · <span style="opacity:.7">yesterday ghosted</span></div>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" role="img" aria-label="Solar power across the whole day"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile" id="tile-batt">
      <div class="label">Battery</div>
      <div class="value" id="batt-v">—</div>
      <div class="badge" id="batt-badge"><span class="dot"></span><span id="batt-badge-text">no data</span></div>
    </div>
    <div class="tile" id="tile-yield">
      <div class="label">Yield today</div>
      <div class="value" id="yield">—</div>
      <div class="sub">since midnight</div>
    </div>
    <div class="tile" id="tile-cabin">
      <div class="label">Cabin</div>
      <div class="value" id="cabin-temp">—</div>
      <div class="sub" id="cabin-sub">&nbsp;</div>
    </div>
    <div class="tile" id="tile-alt">
      <div class="label">Alternator</div>
      <div class="value" id="alt-state">—</div>
      <div class="sub" id="alt-sub">&nbsp;</div>
    </div>
  </div>

<script src="/static/core.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const { el, cssVar, fmt, degF, findDevice, isStale, battStatus, setBadge, shortState } = VanDash;

VanDash.enableSky();

/* ---------- full-day sun arc ---------- */
let today = [], yesterday = [], dayStart = null;
async function loadDays() {
  try {
    const [t, y] = await Promise.all([VanDash.fetchDay(0), VanDash.fetchDay(1)]);
    today = t.rows;
    dayStart = t.start;
    // shift yesterday onto today's time axis for the ghost line
    yesterday = y.rows.map(r => ({ ...r, t: r.t + 86400 }));
    updateDaylight();
    chart.redraw();
  } catch { /* next cycle */ }
}

function updateDaylight() {
  const lit = today.filter(r => (r.w ?? 0) > 1);
  const fmtT = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("daylight").textContent = lit.length
    ? `first light ${fmtT(lit[0].t)} · last light ${fmtT(lit[lit.length - 1].t)}`
    : "";
}

const chart = VanDash.makeChart({
  svg: $("chart"), wrap: $("chart-wrap"), tip: $("tooltip"),
  getData: () => today,
  getDomain: () => [dayStart, dayStart + 86400],
  opts: {
    field: "w", color: "--sun", yFloor: 100, ySnap: 50, xTickS: 3 * 3600,
    gapS: 900, areaOpacity: 0.14,
    labelFmt: r => `<b>${Math.round(r.w)} W</b>`,
    decorate(svg, { X, Y, y0 }) {
      // yesterday's ghost
      const segs = [[]];
      for (const r of yesterday) {
        if (r.w == null) continue;
        const seg = segs[segs.length - 1];
        if (seg.length && r.t - seg[seg.length - 1].t > 900) segs.push([r]);
        else seg.push(r);
      }
      for (const seg of segs) {
        if (seg.length < 2) continue;
        svg.append(el("polyline", {
          points: seg.map(r => `${X(r.t)},${Y(r.w)}`).join(" "),
          fill: "none", stroke: cssVar("--muted"), "stroke-width": 1.5,
          opacity: 0.4, "stroke-linejoin": "round" }));
      }
      // sun/moon marker at "now"
      const now = VanDash.last ? VanDash.last.now : Date.now() / 1000;
      const solar = findDevice("solar");
      const w = solar ? (solar.solar_power ?? 0) : 0;
      const cx = X(now), cy = w > 0.5 ? Y(w) : y0;
      if (w > 0.5) {
        const g = el("g", { stroke: cssVar("--sun"), "stroke-width": 2, "stroke-linecap": "round" });
        g.append(el("circle", { cx, cy, r: 7, fill: cssVar("--sun"), stroke: cssVar("--surface"), "stroke-width": 2 }));
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          g.append(el("line", {
            x1: cx + Math.cos(a) * 11, y1: cy + Math.sin(a) * 11,
            x2: cx + Math.cos(a) * 15, y2: cy + Math.sin(a) * 15 }));
        }
        svg.append(g);
      } else {
        // crescent moon resting on the baseline
        const g = el("g", { fill: cssVar("--ink-2") });
        g.append(el("circle", { cx, cy: cy - 10, r: 7 }));
        g.append(el("circle", { cx: cx + 4, cy: cy - 12, r: 6.5, fill: cssVar("--sky-bottom") || cssVar("--page") }));
        svg.append(g);
      }
    },
  },
});

loadDays();
setInterval(loadDays, 60000);

/* ---------- tiles ---------- */
VanDash.onData(() => {
  const solar = findDevice("solar");
  const dcdc = findDevice("dcdc");
  const heater = findDevice("heater");

  $("tile-batt").classList.toggle("stale", isStale(solar));
  $("tile-yield").classList.toggle("stale", isStale(solar));
  $("tile-cabin").classList.toggle("stale", isStale(heater));
  $("tile-alt").classList.toggle("stale", isStale(dcdc));

  if (solar) {
    $("hero").innerHTML = Math.round(solar.solar_power) + '<span class="unit"> W</span>';
    $("batt-v").innerHTML = fmt(solar.battery_voltage, 1) + '<span class="unit">V</span>';
    const [level, text] = battStatus(solar.battery_voltage, solar.battery_charging_current);
    setBadge($("batt-badge"), $("batt-badge-text"), level, text);
    const wh = solar.yield_today;
    $("yield").innerHTML = wh == null ? "—"
      : wh >= 1000 ? fmt(wh / 1000, 2) + '<span class="unit">kWh</span>'
      : Math.round(wh) + '<span class="unit">Wh</span>';
  }
  if (heater) {
    $("cabin-temp").innerHTML = fmt(degF(heater.cabin_temp), 0) + '<span class="unit">°F</span>';
    $("cabin-sub").textContent = heater.run_state > 0
      ? "heater " + (heater.run_string || "on").toLowerCase()
      : Math.round(heater.humidity) + "% rh · heater off";
  }
  if (dcdc) {
    const running = dcdc.device_state && dcdc.device_state !== "Off";
    $("alt-state").textContent = running ? shortState(dcdc.device_state) : "Off";
    $("alt-sub").textContent = running
      ? "out " + fmt(dcdc.output_voltage) + " V"
      : "starter " + fmt(dcdc.input_voltage) + " V";
  }
});

VanDash.startClock("clock");
VanDash.injectSwitcher("day");
</script>
</body>
</html>
